<footer class="site-footer">
  <div class="footer-inner">
    <ul class="social-links">
      <li><a href="mailto:{{ site.author.email }}" title="Email"><i class="fas fa-envelope"></i></a></li>
      <li><a href="https://github.com/{{ site.author.github }}" title="GitHub"><i class="fab fa-github"></i></a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" title="LinkedIn"><i class="fab fa-linkedin"></i></a></li>
      <li><a href="https://scholar.google.com/citations?user={{ site.author.scholar }}" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}" title="RSS"><i class="fas fa-rss"></i></a></li>
    </ul>
    <p class="footer-note">// {{ site.time | date: '%Y' }} Ferdinand Popp · <a href="{{ site.author.group_url }}">{{ site.author.group_name }}</a> · <a href="https://github.com/{{ site.author.github }}/{{ site.author.github }}.github.io">view source</a></p>
  </div>
</footer>
