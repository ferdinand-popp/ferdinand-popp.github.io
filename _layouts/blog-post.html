layout: default

<article class="post section">
  <p class="section-label">// {{ page.date | date: "%d %b %Y" }}</p>
  <h1>{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; back to blog</a></p>
</article>
